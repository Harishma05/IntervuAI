spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/intervuai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:strict}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=IntervuAI
info.app.description=AI interview practice platform
info.app.version=1.0.0

logging.level.org.hibernate.SQL=warn

groq.api.key=${GROQ_API_KEY:}
app.code-runner.url=${CODE_RUNNER_URL:}
app.code-runner.auth-token=${CODE_RUNNER_AUTH_TOKEN:}
app.code-runner.auth-user=${CODE_RUNNER_AUTH_USER:}
